<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Savings Account</title>
</head>
<body>

    <h1>Create Savings Account</h1>
    <p>Open a new savings account for an existing client.</p>

    <form method="POST">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Create Account</button>
    </form>

    <br>

    <a href="{% url 'savings_account_list' %}">Back to Savings Accounts</a>

</body>
</html>
