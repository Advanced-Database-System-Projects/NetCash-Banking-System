
{% extends "SysDataBase/base.html" %}
{% load static %}

{% block title %}Login | NetCash{% endblock %}

{% block content %}

<!-- LOGIN PAGE -->

<div class="row justify-content-center align-items-center py-4"
     style="min-height: calc(100vh - 6rem);">


    <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">

        <!-- LOGIN CARD -->
        <div class="card">

            <div class="card-body p-4 p-md-5">

                <!-- BRAND -->
                <div class="text-center mb-4">

                    <div class="mb-3">
                        <img src="{% static 'img/brand/netcash-logo.png' %}"
                             alt="NetCash logo"
                             class="netcash-auth-logo"
                             width="76" height="76">
                    </div>

                    <h4 class="fw-bold mb-1">Welcome to NetCash</h4>

                    <p class="text-muted mb-0">
                        Sign in to access your banking account.
                    </p>

                </div>

                <!-- LOGIN FORM -->
                <form method="post">

                    {% csrf_token %}

                    <!-- USERNAME -->
                    <div class="mb-3">

                        <label for="username" class="form-label">
                            Username
                        </label>

                        <input type="text"
                               name="username"
                               id="username"
                               class="form-control"
                               placeholder="Enter your username"
                               autocomplete="username"
                               required>

                    </div>

                    <!-- PASSWORD -->
                    <div class="mb-4">

                        <label for="password" class="form-label">
                            Password
                        </label>

                        <input type="password"
                               name="password"
                               id="password"
                               class="form-control"
                               placeholder="Enter your password"
                               autocomplete="current-password"
                               required>

                    </div>

                    <!-- LOGIN BUTTON -->
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="icon-base ri ri-login-box-line me-1"></i>
                        Login
                    </button>

                    <!-- SIGNUP LINK -->
                    <div class="text-center mt-4">

                        <p class="text-muted mb-0">
                            Don't have an account?
                            <a href="{% url 'borrower_signup' %}"
                               class="text-primary fw-medium">
                                Create a Borrower Account
                            </a>
                        </p>

                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
